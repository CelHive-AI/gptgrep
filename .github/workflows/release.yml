name: Binary release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vVERSION tag to validate, build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'lwyBZss8924d/gptgrep'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: source
        name: Bind tag to source version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Release requires an existing vVERSION tag')
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag != f'v{version}':
              raise SystemExit('Tag does not match Cargo workspace version')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if head != tagged:
              raise SystemExit('Checkout does not match the tagged source')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nrevision={head}\n')
          PY

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.revision }}

  build:
    needs: [validate, checks]
    name: Bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # verified stable action revision
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
      - name: Native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev pkg-config
      - name: Fetch and verify pinned PDFium
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, sys, tarfile, urllib.request
          sys.path.insert(0, 'scripts')
          from package_release import PDFIUM_TAG, TARGETS, verify_pdfium
          target = os.environ['TARGET']
          expected = TARGETS[target]
          url = f"https://github.com/run-llama/pdfium-binaries/releases/download/{PDFIUM_TAG}/{expected['asset']}"
          data = urllib.request.urlopen(url, timeout=60).read()
          if hashlib.sha256(data).hexdigest() != expected['archive_sha256']:
              raise SystemExit('PDFium release asset checksum mismatch')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gptgrep-pdfium'
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall(destination, filter='data')
          verify_pdfium(destination, target)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'PDFIUM_LIB_PATH={destination / "lib"}\n')
              environment.write(f'PDFIUM_INCLUDE_PATH={destination / "include"}\n')
              environment.write(f'GPTGREP_PDFIUM_DIR={destination}\n')
          PY
      - name: Build release binary
        run: cargo build --release --locked --target '${{ matrix.target }}' -p gptgrep-cli
      - name: Package and verify relocation
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/package_release.py \
            --binary "target/$TARGET/release/gptgrep" \
            --pdfium-dir "$GPTGREP_PDFIUM_DIR" \
            --target "$TARGET" --output dist/release \
            --require-clean --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify assets and prepare checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          expected = {'aarch64-apple-darwin', 'x86_64-unknown-linux-gnu'}
          seen = set()
          for path in root.glob('*.release.json'):
              metadata = json.loads(path.read_text())
              target = metadata['target']
              if target not in expected or target in seen:
                  raise SystemExit('Unexpected or duplicate release target')
              if metadata['source_revision'] != os.environ['SOURCE_REVISION'] or metadata['source_dirty']:
                  raise SystemExit('Artifact source provenance mismatch')
              if 'v' + metadata['version'] != os.environ['RELEASE_TAG'] or not metadata['rust_licenses']['complete']:
                  raise SystemExit('Artifact version/license mismatch')
              stem = path.name.removesuffix('.release.json')
              archive = root / (stem + '.tar.gz')
              archive_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              smoke = json.loads((root / (stem + '.smoke.json')).read_text())
              if smoke['archive_sha256'] != archive_digest or not smoke['bundled_pdfium_verified']:
                  raise SystemExit('Missing or mismatched archive relocation verification')
              recorded = (root / (stem + '.tar.gz.sha256')).read_text().split()[0]
              if archive_digest != recorded:
                  raise SystemExit('Archive checksum mismatch')
              seen.add(target)
          if seen != expected:
              raise SystemExit('The release target set is incomplete')
          checksums = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}' for path in sorted(root.iterdir()) if path.is_file()]
          (root / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
          pathlib.Path('release-notes.md').write_text('Native GPTgrep bundles for macOS ARM64 and Linux x86_64.\n\nEach archive includes the native CLI, PDFium, source license files, checksums and provenance. Both archives passed native relocation and PDF/plaintext smoke tests in this workflow.\n\nSource: ' + os.environ['SOURCE_REVISION'] + '\n')
          PY
      - name: Publish the existing source tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets." >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "GPTgrep $RELEASE_TAG" \
            --notes-file release-notes.md "${flags[@]}" dist/*
